name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install development checker
        run: python -m pip install --disable-pip-version-check ruff==0.15.20
      - name: Static and syntax checks
        run: |
          python -m compileall -q scripts tests
          ruff check scripts tests
          python -c 'import glob,json; [json.load(open(path, encoding="utf-8")) for path in glob.glob("**/*.json", recursive=True)]'
      - name: Adversarial regression suite
        run: python -m unittest discover -s tests -v
      - name: Validate chain adapter maturity registry
        run: python scripts/validate_adapters.py adapters/chains/registry.json
      - name: Validate scope and graph projection
        run: |
          python scripts/inventory.py \
            --scope evals/web/sample-scope.json \
            --output /tmp/invariant-helix-inventory.json
          python scripts/normalize_observations.py \
            evals/web/sample-observations.jsonl \
            --output /tmp/invariant-helix-graph.json
          python -c 'import json; assert json.load(open("/tmp/invariant-helix-graph.json")) == json.load(open("evals/web/sample-graph.json"))'
      - name: Verify evidence and release gates
        run: |
          python scripts/evidence_manifest.py evals/web/evidence \
            --verify evals/web/evidence-manifest.json
          python scripts/validate_findings.py evals/web/sample-findings.json \
            --release \
            --case-manifest evals/web/sample-scope.json \
            --manifest evals/web/evidence-manifest.json \
            --evidence-root evals/web/evidence
          python scripts/validate_findings.py evals/evm/sample-findings.json \
            --release \
            --case-manifest evals/evm/sample-scope.json \
            --manifest evals/evm/evidence-manifest.json \
            --evidence-root evals/evm/evidence
      - name: Validate coverage and end-to-end case
        run: |
          python scripts/validate_coverage.py evals/web/sample-coverage.json \
            --case-manifest evals/web/sample-scope.json \
            --manifest evals/web/evidence-manifest.json
          python scripts/evaluate_case.py \
            --case-manifest evals/web/sample-scope.json \
            --graph evals/web/sample-graph.json \
            --findings evals/web/sample-findings.json \
            --coverage evals/web/sample-coverage.json \
            --manifest evals/web/evidence-manifest.json \
            --evidence-root evals/web/evidence \
            --release
      - name: Validate safe helper fixtures
        run: |
          python scripts/race_runner.py evals/web/sample-race-spec.json
          python scripts/cve_match.py \
            --inventory evals/web/sample-components.json \
            --cves evals/web/sample-cves.json \
            --output /tmp/invariant-helix-cves.json
      - name: Validate audit engine (x-ray, knowledge base, lenses, scoring)
        run: |
          python scripts/check_capabilities.py --case-manifest evals/evm/sample-scope.json \
            --emit-blocked-coverage /tmp/ih-blocked.json
          python scripts/cvss.py "CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:C/C:H/I:H/A:H" --json
          # x-ray produces a graph-valid model on EVM and on a non-EVM fixture
          python scripts/xray_enumerate.py --scope evals/evm/sample-scope.json \
            --root evals/evm --output /tmp/ih-xray-evm.jsonl
          python scripts/normalize_observations.py /tmp/ih-xray-evm.jsonl --output /tmp/ih-xray-evm-graph.json
          python scripts/xray_enumerate.py --scope evals/solana/sample-scope.json \
            --root evals/solana --output /tmp/ih-xray-sol.jsonl
          python scripts/normalize_observations.py /tmp/ih-xray-sol.jsonl --output /tmp/ih-xray-sol-graph.json
          # knowledge base normalizes and grounds hypotheses (no network; committed fixture)
          python scripts/kb_sync.py --source evals/kb/incidents --source evals/kb/cve --index /tmp/ih-kb.json
          python scripts/kb_match.py --graph /tmp/ih-xray-evm-graph.json --index /tmp/ih-kb.json --min-score 0.3
          # dispatch, bundle, hash, chain
          python scripts/lens_dispatch.py --graph /tmp/ih-xray-evm-graph.json \
            --actor a1 --actor a2 --output /tmp/ih-dispatch.json
          python scripts/build_lens_bundle.py --dispatch /tmp/ih-dispatch.json --output-dir /tmp/ih-bundles
          python scripts/evidence_manifest.py /tmp/ih-bundles --case-id eval-evm-001 \
            --snapshot-id fixture-v1 --producer lens-bundler --output /tmp/ih-bundle-manifest.json
          python scripts/chain_findings.py evals/evm/sample-findings.json --graph /tmp/ih-xray-evm-graph.json
      - name: Validate analyzers against real tool formats
        run: |
          # Solidity analyzer must find every planted bug in the vulnerable fixture
          python scripts/solidity_analyze.py --scope evals/evm/sample-scope.json \
            --root evals/evm --output /tmp/ih-sol.jsonl
          python scripts/normalize_observations.py /tmp/ih-sol.jsonl --output /tmp/ih-sol-graph.json
          # recon + crawl parsers against real nmap/httpx/ffuf/gobuster/HAR/Burp output
          for f in nmap.xml httpx.jsonl ffuf.json gobuster.txt amass.txt; do
            python scripts/recon_to_obs.py "evals/recon/$f" \
              --scope evals/web/sample-scope.json --output "/tmp/ih-recon-$f.jsonl"
            python scripts/normalize_observations.py "/tmp/ih-recon-$f.jsonl" --output "/tmp/ih-recon-$f.json"
          done
          for f in crawl.har burp-sitemap.json; do
            python scripts/scrapling_to_obs.py "evals/recon/$f" \
              --scope evals/web/sample-scope.json --output "/tmp/ih-crawl-$f.jsonl"
            python scripts/normalize_observations.py "/tmp/ih-crawl-$f.jsonl" --output "/tmp/ih-crawl-$f.json"
          done
          # researcher findings ingest -> knowledge base -> grounded leads
          python scripts/findings_ingest.py evals/kb/findings \
            --source fixture-findings --output /tmp/ih-findings.json
          python scripts/kb_match.py --graph /tmp/ih-sol-graph.json \
            --index /tmp/ih-findings.json --min-score 0.3
