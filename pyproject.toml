[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invariant-helix"
version = "0.5.0"
description = "Fail-closed security audit skill: graph + lenses + evidence gates"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "Takumixbt"}]

[project.scripts]
ih-inventory = "scripts.inventory:main"
ih-normalize = "scripts.normalize_observations:main"
ih-merge = "scripts.graph_merge:main"
ih-validate-findings = "scripts.validate_findings:main"
ih-validate-coverage = "scripts.validate_coverage:main"
ih-evidence = "scripts.evidence_manifest:main"
ih-race = "scripts.race_runner:main"
ih-cve = "scripts.cve_match:main"
ih-validate-adapters = "scripts.validate_adapters:main"
ih-evaluate-case = "scripts.evaluate_case:main"
ih-check-capabilities = "scripts.check_capabilities:main"
ih-cvss = "scripts.cvss:main"
ih-xray-enumerate = "scripts.xray_enumerate:main"
ih-xray-git = "scripts.xray_git:main"
ih-lens-dispatch = "scripts.lens_dispatch:main"
ih-lens-bundle = "scripts.build_lens_bundle:main"
ih-converge = "scripts.converge_findings:main"
ih-chain = "scripts.chain_findings:main"
ih-kb-sync = "scripts.kb_sync:main"
ih-kb-match = "scripts.kb_match:main"
ih-scrapling-normalize = "scripts.scrapling_to_obs:main"
ih-recon-normalize = "scripts.recon_to_obs:main"
ih-solidity-analyze = "scripts.solidity_analyze:main"
ih-money-map = "scripts.money_map:main"
ih-audit = "scripts.audit:main"
ih-slither-ingest = "scripts.slither_ingest:main"
ih-poc = "scripts.poc:main"
ih-loop = "scripts.audit_loop:main"
ih-findings-ingest = "scripts.findings_ingest:main"
ih-self-audit = "scripts.self_audit:main"
ih-banner = "scripts.banner:main"

[tool.setuptools]
packages = ["scripts"]

[tool.ruff]
line-length = 100
target-version = "py310"
